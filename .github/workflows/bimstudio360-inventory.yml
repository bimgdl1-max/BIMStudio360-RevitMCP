name: BIM Studio 360 - Inventario estatico MCP

on:
  push:
    branches:
      - main
      - "bimstudio360/**"
    paths:
      - "lib/RevitMCP_ExternalServer/tools/**"
      - "scripts/bimstudio360_inventory.py"
      - "scripts/tests/**"
      - "docs/bimstudio360/tool-baseline.json"
      - ".github/workflows/bimstudio360-inventory.yml"
  pull_request:
    paths:
      - "lib/RevitMCP_ExternalServer/tools/**"
      - "scripts/bimstudio360_inventory.py"
      - "scripts/tests/**"
      - "docs/bimstudio360/tool-baseline.json"
      - ".github/workflows/bimstudio360-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar catalogo de herramientas sin ejecutar Revit
        run: python scripts/bimstudio360_inventory.py --check
      - name: Pruebas de inventario sin dependencias externas
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
